name: Process Spiffs

# Billy's "Run payroll" button in the app appends a row to the run_requests Sheet tab. This
# workflow is a WATCHER: the job stays alive for ~5h45m, polling that tab every 30 seconds and
# processing a request (tests -> ServiceTitan pull -> splice -> commit/push) within seconds of it
# appearing, then starts its own successor before the 6-hour job limit. See watch_requests.py.
#
# Why not just a cron schedule: GitHub throttles scheduled workflows hard — observed 2026-10-02 as
# one run every 4-6 HOURS despite `*/5` — so requests sat on "Queued" for hours. The hourly cron
# below is only a safety net that restarts the chain if it ever dies; the concurrency group keeps
# it from running alongside a live watcher (it waits its turn instead).
#
# One click on "Run workflow" (Actions tab) starts a watcher; it then keeps itself going.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: process-spiffs
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # 5h45m of polling (watch_requests.py) + headroom for a request being processed right at the
    # end; GitHub's hard cap is 6h.
    timeout-minutes: 355
    env:
      ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID }}
      ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET }}
      ST_APP_KEY: ${{ secrets.ST_APP_KEY }}
      ST_TENANT_ID: ${{ secrets.ST_TENANT_ID }}
      SPIFFS_SHARED_KEY: ${{ secrets.SPIFFS_SHARED_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Watch for queued payroll runs
        run: python watch_requests.py
