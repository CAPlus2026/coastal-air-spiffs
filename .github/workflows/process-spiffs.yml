name: Process Spiffs

# MANUAL ONLY (changed 2026-11-04, approved by Billy). The 24/7 watcher and the hourly cron safety
# net were removed: spiffs run once a month, so the workflow now runs only when someone clicks
# "Run workflow" on the Actions tab.
#
# How to run a month: click "Run payroll" in the app (queues the month in the run_requests tab),
# then Actions -> Process Spiffs -> Run workflow. The job processes whatever is queued ONCE
# (tests -> ServiceTitan pull -> splice -> commit/push) and exits. It does not poll and does not
# start a successor run.
on:
  workflow_dispatch:
    inputs:
      force_preflight:
        description: "Proceed even if the pre-flight orphan check blocks (passes --force-preflight). Only after the block was investigated and approved."
        type: boolean
        default: false

concurrency:
  group: process-spiffs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # One-shot: process queued month(s) and exit.
    timeout-minutes: 60
    env:
      ST_CLIENT_ID: ${{ secrets.ST_CLIENT_ID }}
      ST_CLIENT_SECRET: ${{ secrets.ST_CLIENT_SECRET }}
      ST_APP_KEY: ${{ secrets.ST_APP_KEY }}
      ST_TENANT_ID: ${{ secrets.ST_TENANT_ID }}
      SPIFFS_SHARED_KEY: ${{ secrets.SPIFFS_SHARED_KEY }}
      GH_TOKEN: ${{ github.token }}
      FORCE_PREFLIGHT: ${{ inputs.force_preflight && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Process queued payroll run(s) once (no polling, no successor)
        run: |
          python - <<'PY'
          import watch_requests as w
          seen = set()
          for _ in range(5):  # hard cap; normally one month is queued
              month = w.queued_month()
              # queued_month() can return a "(couldn't fetch ...)" message when the Sheet read
              # fails (that wrote 113 junk run_requests rows on 2026-11-04) — treat it as nothing queued.
              if not month or month.startswith("(") or month in seen:
                  break
              seen.add(month)
              w.handle(month)
          if not seen:
              print("Nothing queued. Click 'Run payroll' in the app first, then re-run this workflow.")
          PY
